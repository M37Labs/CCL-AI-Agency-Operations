<script>
/* MERGED DEMO LAYER
   Keeps the original workflow engine intact while exposing the requested demo surface. */
(function(){
  const originalRenderModal = App.renderModal;

  Object.keys(NAV).forEach(key => delete NAV[key]);
  Object.assign(NAV, {
    Workspace: [
      ['mailbox','mail','Email Monitoring'],
      ['requests','inbox','Brief Capture'],
      ['jobs','folder','Jobs & Tasks'],
      ['queue','layers','Queries'],
      ['teams','users','Team Members'],
      ['clients','building','Clients']
    ],
    Operations: [
      ['board','columns','Task Management']
    ],
    Intelligence: [
      ['reporting','file','Reports'],
      ['lab','spark','Experiment Lab'],
      ['knowledge','book','Archives']
    ],
    Admin: [
      ['roles','shield','Roles & RBAC']
    ]
  });

  App.getAccessibleClients = function(){
    const role = this.state.role;
    if(['leadership','servicing','finance','legal','hr'].includes(role)) return this.data.clients;
    if(role === 'department') return this.data.clients.filter(c => this.data.jobs.some(j => j.client === c.name && j.departments.includes('Creative')));
    const name = this.role().name;
    return this.data.clients.filter(c => c.am === name || this.data.jobs.some(j => j.client === c.name && j.am === name));
  };
  App.getAccessibleJobs = function(){
    const role = this.state.role;
    if(['leadership','servicing','finance','hr'].includes(role)) return this.data.jobs;
    if(role === 'legal') return this.data.jobs.filter(j => j.departments.includes('Legal'));
    if(role === 'department') return this.data.jobs.filter(j => j.departments.includes('Creative'));
    const name = this.role().name;
    const clients = this.getAccessibleClients().map(c => c.name);
    return this.data.jobs.filter(j => j.am === name || clients.includes(j.client));
  };
  App.getAccessibleTasks = function(){
    const jobs = new Set(this.getAccessibleJobs().map(j => j.code));
    if(this.state.role === 'department') return this.data.tasks.filter(t => jobs.has(t.job) && t.dept === 'Creative');
    if(this.state.role === 'legal') return this.data.tasks.filter(t => jobs.has(t.job) && t.dept === 'Legal');
    return this.data.tasks.filter(t => jobs.has(t.job));
  };
  App.getAccessibleRequests = function(){
    const clients = new Set(this.getAccessibleClients().map(c => c.name));
    if(['leadership','servicing','finance','legal','hr'].includes(this.state.role)) return this.data.requests;
    return this.data.requests.filter(r => clients.has(r.client) || r.am === this.role().name || r.am === '—');
  };
  App.getDailyBriefing = function(){
    const jobs = this.getAccessibleJobs().filter(j => j.status !== 'Completed');
    const tasks = this.getAccessibleTasks();
    const requests = this.getAccessibleRequests();
    const blocked = tasks.filter(t => t.blocked && t.status !== 'Completed').length;
    const overdue = tasks.filter(t => t.status !== 'Completed' && new Date('2026 '+t.due) < TODAY).length;
    const unassigned = requests.filter(r => r.am === '—' || r.workflow?.redelegationRequested).length;
    const pending = requests.filter(r => r.stage === 'Brief Approved' || (r.workflow && r.workflow.momSent && !r.workflow.clientApproved)).length;
    const profile = this.role();
    let summary = `${jobs.length} live jobs, ${blocked} blocked deliverables, and ${unassigned} unassigned brief${unassigned === 1 ? '' : 's'}.`;
    if(this.state.role === 'am') summary = `You have ${jobs.length} active client jobs, ${pending} approval${pending === 1 ? '' : 's'} pending, and ${blocked} blocked deliverable${blocked === 1 ? '' : 's'}.`;
    if(this.state.role === 'leadership') summary = `Across the agency: ${jobs.length} live jobs, ${this.outstanding() ? money(this.outstanding()) : '₹0'} outstanding, and ${blocked} blocked milestone${blocked === 1 ? '' : 's'}.`;
    return {greeting:`Good morning, ${profile.name.split(' ')[0]}.`,summary,stats:{activeJobs:jobs.length,blocked,overdueTasks:overdue,unassigned,pendingApprovals:pending}};
  };

  App.sidebar = function(){

  App.saveManualRequest = function(e){
    e.preventDefault(); const f=new FormData(e.target), client=String(f.get('client')), title=String(f.get('title')).trim(), desc=String(f.get('desc')).trim(), source=String(f.get('source')||'Phone Call'), priority=String(f.get('priority')||'Normal'), deadline=String(f.get('deadline')||'2026-10-05'), owner=String(f.get('owner')||'—');

    const next=Math.max(0,...this.data.requests.map(r=>Number(String(r.id).replace('REQ-',''))||0))+1, id=`REQ-${next}`;
    const req={id,source,sourceDetail:`Manual log by ${this.role().name}`,client,campaign:title,stage:'Incoming',am:owner,priority,date:'2026-09-17',deadline,description:desc,files:[]};
    this.data.requests.unshift(req); const w=this.ensureWorkflow(req); Object.assign(w,{am:owner==='—'?'':owner,writtenBrief:`CLIENT REQUEST\n${desc}\n\nAUDIENCE\nTarget customers for ${client}.\n\nCOMPETITION\nCategory competitors.\n\nCOMMUNICATION OBJECTIVE\nDeliver impactful communication.\n\nMANDATORIES & DEADLINE\nDelivery by ${deadline}.`,clientWords:desc,audience:`Target customers for ${client}.`,competition:'Category competitors.',objective:'Deliver impactful communication.',mandatories:`Delivery by ${deadline}.`,deliverables:[title],departments:['Creative']});
    this.data.audit.unshift({time:'Just now',who:this.role().name,what:`Manual request ${id} created via ${source}`,job:id});

    return `<header class="topbar"><button class="search-trigger" onclick="App.openPalette()">${icon('search')}<span>Search clients, jobs, tasks…</span><span class="key">⌘ K</span></button><div style="position:absolute;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;background:#26212d;border-radius:999px;padding:3px;box-shadow:0 5px 18px #0002;"><button class="btn small" style="min-width:76px;min-height:30px;padding:5px 12px;border:0;border-radius:999px;background:${chat?'#bb1e70':'transparent'};color:#fff;" onclick="App.nav('chatops')" aria-label="Chat mode">Chat</button><button class="btn small" style="min-width:84px;min-height:30px;padding:5px 12px;border:0;border-radius:999px;background:${chat?'transparent':'#fff'};color:${chat?'#d8cfdf':'#17131b'};" onclick="App.nav('dashboard')" aria-label="Dashboard mode">Dashboard</button></div><div class="top-actions"><button class="btn small" onclick="App.startDemo()">${icon('play')} Guided demo</button><button class="icon-btn" aria-label="Switch to ${dark?'light':'dark'} mode" title="Switch theme" onclick="App.toggleTheme()">${icon(dark?'sun':'moon')}</button><span style="position:relative;display:inline-flex;"><button class="icon-btn" aria-label="Notifications" title="Notifications" onclick="App.toggleNotifs()">${icon('bell')}</button>${this.state.notifOpen?`<div style="position:absolute;right:0;top:calc(100% + 8px);width:240px;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:8px;z-index:60;"><button class="btn small" style="width:100%;justify-content:flex-start;margin-bottom:6px;" onclick="App.nav('mailbox')">${icon('mail')} ${unreadMail} unread email${unreadMail===1?'':'s'}</button><button class="btn small" style="width:100%;justify-content:flex-start;margin-bottom:6px;" onclick="App.nav('board')">${icon('columns')} ${overdueTasks} overdue task${overdueTasks===1?'':'s'}</button><button class="btn small" style="width:100%;justify-content:flex-start;" onclick="App.nav('finance')">${icon('wallet')} ${openInvoices} open invoice${openInvoices===1?'':'s'}</button></div>`:''}</span></div></header>`;
  };
  App.view_chatops = function(){
    this.chatInit();
    const prompts=['What needs my attention today?','Capture a new brief','Show blocked work','How much is outstanding?'];
    const messages=this.state.chatMessages.slice(-4).map(m=>`<article class="chat-center-message ${m.role==='user'?'user':''}">${m.kicker?`<small>${esc(m.kicker)}</small>`:''}${esc(m.text)}</article>`).join('');
    const briefing=this.getDailyBriefing(), jobs=this.getAccessibleJobs().filter(j=>j.status!=='Completed').length;
    return `<section class="chat-center-shell"><div class="chat-center-card"><div class="chat-center-brand">${icon('spark')}</div><div class="chat-center-eyebrow">CCL.AI · LIVE WORKSPACE</div><h1>Welcome back</h1><p class="chat-center-subtitle">Ask anything about your clients, jobs, approvals, billing, or what needs attention across the agency.</p><div class="chat-center-bubble"><small>${esc(this.role().name)}</small><button onclick="App.chatSend('What is overdue?')">What is overdue?</button></div><div class="chat-center-thread" id="command-thread" aria-live="polite">${messages}</div><form class="chat-center-composer" onsubmit="event.preventDefault();App.chatSend(this.prompt.value);this.reset()"><textarea name="prompt" rows="2" aria-label="Ask CCL AI" placeholder="Ask anything, @ to mention, / for actions">${esc(this.state.voiceDraft||'')}</textarea><div class="chat-center-tools"><button type="button" aria-label="Attach source material" onclick="App.toast('Attach an email, brief or source material')">${icon('plus')}</button><button type="button" aria-label="Voice to text" title="Voice to text" class="voice-button" onclick="App.toggleVoiceInput()">${icon('radio')}</button><span class="spacer"></span><button type="submit" class="send" aria-label="Send message">${icon('arrow')}</button></div><div class="chat-center-hint">${this.state.voiceActive?'Listening… speak now':'Voice to text is available when your browser supports speech recognition'} · Press Enter to send</div></form><div class="chat-center-prompts">${prompts.map(p=>`<button onclick="App.chatSend('${p.replace(/'/g,"\\'")}')">${esc(p)}</button>`).join('')}</div><div class="chat-center-widgets"><article class="chat-center-widget"><small>Active jobs</small><strong>${jobs}</strong><span>In your current scope</span></article><article class="chat-center-widget"><small>Pending approvals</small><strong>${briefing.stats.pendingApprovals}</strong><span>Awaiting client reply</span></article><article class="chat-center-widget risk"><small>Needs attention</small><strong>${briefing.stats.blocked+briefing.stats.unassigned}</strong><span>Blocked and unassigned work</span></article></div></div></section>`;
  };
  App.toggleVoiceInput = function(){
    const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(this.state.voiceRecognition){this.state.voiceRecognition.stop();return;}
    if(!SpeechRecognition){this.toast('Voice to text is not supported in this browser');return;}
    const recognition=new SpeechRecognition(); recognition.lang='en-IN'; recognition.interimResults=true; recognition.continuous=false;
    recognition.onstart=()=>{this.state.voiceActive=true;this.render()};
    recognition.onresult=(event)=>{const text=Array.from(event.results).map(r=>r[0].transcript).join('');this.state.voiceDraft=text;const input=document.querySelector('.chat-center-composer textarea');if(input)input.value=text};
    recognition.onerror=()=>{this.state.voiceActive=false;this.state.voiceRecognition=null;this.toast('Voice input could not be started')};
    recognition.onend=()=>{this.state.voiceActive=false;this.state.voiceRecognition=null;const hint=document.querySelector('.chat-center-hint');if(hint)hint.textContent='Voice to text is ready · Press Enter to send'};
    this.state.voiceRecognition=recognition; recognition.start();
  };
  const originalChatSendForVoice=App.chatSend;
  App.chatSend=function(raw){this.state.voiceDraft='';return originalChatSendForVoice.call(this,raw)};
  App.view_chatops = function(){
    this.chatInit();
    const prompts=['What needs my attention today?','Capture a new brief','Show blocked work','How much is outstanding?'];
    const messages=this.state.chatMessages.slice(-4).map(m=>`<article class="chat-center-message ${m.role==='user'?'user':'from-assistant'}">${m.kicker?`<small>${esc(m.kicker)}</small>`:''}${esc(m.text)}${m.html||''}</article>`).join('');
    const briefing=this.getDailyBriefing(),jobs=this.getAccessibleJobs().filter(j=>j.status!=='Completed').length,workspace=this.state.chatWorkspace||{title:'Today’s operating picture'};
    return `<section class="chat-center-shell"><div class="chat-center-card"><div class="chat-center-status-row"><span class="chat-live-pill"><i></i>Live operating data</span><span class="chat-role-label">${esc(this.role().label)} view</span></div><div class="chat-center-brand">${icon('spark')}</div><div class="chat-center-eyebrow">CCL.AI · OPERATIONS COPILOT</div><h1 class="chat-title">What should we move forward?</h1><p class="chat-center-subtitle">Your creative command layer for clients, briefs, jobs, approvals, billing, workload, and everything that needs a decision.</p><div class="chat-center-suggestion-grid"><button class="chat-center-suggestion" onclick="App.chatSend('Capture a new brief')"><span class="suggestion-icon">${icon('pen')}</span><strong>Capture a brief</strong><small>Turn a request into a controlled workflow.</small></button><button class="chat-center-suggestion" onclick="App.chatSend('Show blocked work')"><span class="suggestion-icon">${icon('columns')}</span><strong>Unblock work</strong><small>Find risk, overdue tasks, and stalled approvals.</small></button><button class="chat-center-suggestion" onclick="App.chatSend('Check team availability')"><span class="suggestion-icon">${icon('users')}</span><strong>Balance workload</strong><small>See who can take the next deliverable.</small></button><button class="chat-center-suggestion" onclick="App.chatSend('How much is outstanding?')"><span class="suggestion-icon">${icon('wallet')}</span><strong>Review business</strong><small>Open receivables, billing, and client health.</small></button></div><div class="chat-center-bubble"><small>${esc(this.role().name)}</small><button onclick="App.chatSend('What is overdue?')">What is overdue?</button></div><div class="chat-center-thread" id="command-thread" aria-live="polite">${messages}</div><form class="chat-center-composer" onsubmit="event.preventDefault();App.chatSend(this.prompt.value);this.reset()"><textarea name="prompt" rows="2" aria-label="Ask CCL AI" placeholder="Ask anything, @ to mention, / for actions">${esc(this.state.voiceDraft||'')}</textarea><div class="chat-center-tools"><button type="button" aria-label="Attach source material" onclick="App.toast('Attach an email, brief or source material')">${icon('plus')}</button><button type="button" aria-label="Voice to text" title="Voice to text" class="voice-button ${this.state.voiceActive?'is-listening':''}" onclick="App.toggleVoiceInput()">${icon('radio')}</button><span class="spacer"></span><button type="submit" class="send" aria-label="Send message">${icon('arrow')}</button></div><div class="chat-center-hint">${this.state.voiceActive?'Listening… speak now':'Voice to text is available when supported'} · Press Enter to send</div></form><div class="chat-center-prompts">${prompts.map(p=>`<button onclick="App.chatSend('${p.replace(/'/g,"\\'")}')">${esc(p)}</button>`).join('')}</div><div class="chat-center-context"><div><small>Current copilot focus</small><strong>${esc(workspace.title)}</strong></div><div class="chat-center-context-actions"><button onclick="App.nav('jobs')">Jobs</button><button onclick="App.nav('board')">Tasks</button><button onclick="App.nav('teams')">Team</button></div></div><div class="chat-center-widgets"><article class="chat-center-widget"><small>Active jobs</small><strong>${jobs}</strong><span>In your current scope</span></article><article class="chat-center-widget"><small>Pending approvals</small><strong>${briefing.stats.pendingApprovals}</strong><span>Awaiting client reply</span></article><article class="chat-center-widget risk"><small>Needs attention</small><strong>${briefing.stats.blocked+briefing.stats.unassigned}</strong><span>Blocked and unassigned work</span></article></div><div class="chat-center-footer-note">Connected to <b>brief capture</b> · <b>task management</b> · <b>team workload</b> · <b>reports</b> · <b>archives</b></div></div></section>`;
  };
  const originalChatSendForIntent=App.chatSend;
  App.chatSend=function(raw){
    const q=String(raw||'').trim();
    if(!q)return;
    const routed=/blocked|overdue/i.test(q)?`${q} risk`: /outstanding|receivable/i.test(q)?`${q} billing`: /workload/i.test(q)?`${q} team availability`:q;
    return originalChatSendForIntent.call(this,routed);
  };

  const allowed=['dashboard','mailbox','requests','jobs','queue','teams','clients','board','reporting','lab','knowledge','roles'];
  if(!allowed.includes(App.state.view)) App.state.view='dashboard';
  App.render();
  App.bootstrapBackend();
})();
</script>
<style id="ccl-review-style">
/* Review feedback layer — every colour comes from the dashboard tokens so light and dark both work, including in chat. */
:root{--panel:var(--surface)}
.chat-main-only{margin-left:0!important}
main.content:focus{outline:none}
.dept-table>div{column-gap:12px}

/* Top bar */
.mode-switch{position:absolute;left:50%;transform:translateX(-50%);display:flex;gap:2px;padding:3px;border:1px solid var(--line);border-radius:999px;background:var(--surface-2)}
.mode-switch button{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:5px 14px;border:0;border-radius:999px;background:transparent;color:var(--muted);font-weight:600;font-size:12px}
.mode-switch button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.mode-switch .icon{width:14px;height:14px}
.notif-wrap{position:relative;display:inline-flex}
.notif-btn{position:relative}
.notif-count{position:absolute;top:3px;right:3px;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--red);color:#fff;font:600 10px/17px DM Mono,monospace;text-align:center}
.notif-panel{position:absolute;right:0;top:calc(100% + 8px);width:360px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.18);z-index:60;overflow:hidden;text-align:left}
.notif-head{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.notif-list{max-height:380px;overflow:auto}
.notif-item{display:flex;gap:10px;width:100%;text-align:left;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink)}
.notif-item:hover{background:var(--surface-2)}
.notif-item>i{flex:0 0 8px;height:8px;margin-top:6px;border-radius:50%}
.notif-item.unread>i{background:var(--blue)}
.notif-item.unread.warn>i{background:var(--amber)}
.notif-item.unread.good>i{background:var(--moss)}
.notif-item strong{display:block;font-size:13px;font-weight:600}
.notif-item.unread strong{font-weight:700}
.notif-item small{display:block;color:var(--muted);font-size:12px;line-height:1.4}
.notif-item time{display:block;color:var(--muted);font:10px DM Mono,monospace;margin-top:3px}
.notif-empty{margin:0;padding:18px 14px;color:var(--muted)}
.notif-foot{display:flex;flex-wrap:wrap;gap:6px;padding:10px 14px;background:var(--surface-2)}
.notif-foot button{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:11px}
.notif-foot .icon{width:13px;height:13px}

/* Dashboard */
.board-sync-note{display:flex;gap:10px;align-items:flex-start;margin:0 0 14px;padding:10px 12px;border:1px dashed var(--line);border-radius:8px;background:var(--surface-2);color:var(--muted);font-size:12px;line-height:1.45}
.board-sync-note .icon{flex:0 0 16px;width:16px;height:16px;color:var(--accent);margin-top:1px}
.board-sync-note strong{color:var(--ink);margin-right:4px}
.today-row.today-head{padding:8px 0 6px;font:10px DM Mono,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.today-row .task-bullet{width:8px;height:8px;border-radius:50%}
.row-flags{display:flex;gap:5px;margin-top:5px;flex-wrap:wrap}
.row-flags .badge{margin:0}
.badge .icon{width:11px;height:11px}
.status-select:disabled{opacity:.55;cursor:not-allowed}
.dept-legend i{width:10px;height:10px}
.dept-table .fill{opacity:.9}
.dept-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;flex:0 0 8px}

/* Experiment Lab: subtle future-scope entry */
.nav-btn.future-scope{margin-top:auto;opacity:.28;border:1px dashed transparent;transition:opacity .25s var(--ease),border-color .25s var(--ease);position:relative}
.nav-btn.future-scope .icon{width:15px;height:15px}
.nav-btn.future-scope:hover,.nav-btn.future-scope:focus-visible,.nav-btn.future-scope.active{opacity:1;border-color:var(--line)}
.nav-btn.future-scope em{display:block;font-style:normal;font:9px DM Mono,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.future-banner{display:flex;gap:12px;align-items:flex-start;margin-bottom:16px;padding:12px 14px;border:1px dashed var(--line);border-radius:var(--r);background:var(--surface-2)}
.future-banner>.icon{flex:0 0 18px;width:18px;height:18px;color:var(--accent);margin-top:2px}
.future-banner>div{display:grid;gap:2px}
.future-banner span{color:var(--muted);font-size:13px}

#modal-root.modal-stable .modal,#modal-root.modal-stable .modal-layer{animation:none}

.capture-switch{position:static;transform:none;width:max-content;max-width:100%;margin:0 0 14px}

/* Kanban */
.task.held{opacity:.72;border-style:dashed}
.kanban .task{cursor:pointer;transition:box-shadow .2s var(--ease),border-color .2s var(--ease)}
.kanban .task:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.kanban .task.expanded{opacity:1;border-color:var(--accent);box-shadow:0 8px 24px rgba(0,0,0,.1);cursor:default}
.task-expand-hint{display:inline-flex;align-items:center;gap:3px;margin-top:8px;color:var(--muted);font-size:11px}
.task-expand-hint .icon{width:12px;height:12px}
.task.expanded .task-card-head{cursor:pointer}
.task-details{display:grid;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line);cursor:auto}
.task-brief{margin:0;color:var(--ink-2);font-size:12px;line-height:1.45}
.task-details dl{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0}
.task-details dt{color:var(--muted);font:9px DM Mono,monospace;letter-spacing:.08em;text-transform:uppercase}
.task-details dd{margin:2px 0 0;font-size:12px;color:var(--ink)}
.task-details dd .badge{margin:0}
.due-late{color:var(--red);font-weight:600}
.task-flag{display:flex;gap:6px;align-items:flex-start;padding:7px 9px;border-radius:7px;font-size:11px}
.task-flag .icon{flex:0 0 13px;width:13px;height:13px;margin-top:1px}
.task-flag.bad{background:color-mix(in srgb,var(--red) 10%,transparent);color:var(--red)}
.task-flag.warn{background:color-mix(in srgb,var(--amber) 12%,transparent);color:var(--amber)}
.task-sources,.task-activity{display:flex;flex-wrap:wrap;gap:5px}
.task-sources small,.task-activity small{flex-basis:100%;color:var(--muted);font:9px DM Mono,monospace;letter-spacing:.08em;text-transform:uppercase}
.task-sources .file-chip{margin:0}
.task-activity span{flex-basis:100%;font-size:11px;color:var(--ink-2)}
.task-activity time{color:var(--muted)}
.task-detail-actions{display:flex;flex-wrap:wrap;gap:6px}
.task-detail-actions .input{flex:1 1 100%;min-height:32px;padding:4px 8px;font-size:12px}
.task-detail-actions .btn{flex:1;width:auto;margin:0;min-height:32px}
.task-detail-actions .btn .icon{width:13px;height:13px}

/* Jobs & sub-tasks */
.job-actions{display:flex;flex-wrap:wrap;gap:6px}
.job-actions .btn{width:auto;margin:0}
.job-actions .icon{width:13px;height:13px}
.subtask-toggle .icon,.job-name-toggle .icon{transition:transform .2s var(--ease)}
.subtask-toggle.open .icon,.job-name-toggle[aria-expanded="true"] .icon{transform:rotate(180deg)}
.job-name-toggle{display:inline-flex;align-items:center;gap:6px;padding:0;border:0;background:none;color:var(--ink);text-align:left;cursor:pointer}
.job-name-toggle:hover strong{text-decoration:underline;text-underline-offset:3px}
.job-name-toggle .icon{width:14px;height:14px;color:var(--muted)}
.job-name-toggle+small{display:block}
.job-detail-panel{margin:14px 0 10px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.job-detail-panel .stage-track{margin-bottom:14px}
.job-detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.job-detail-grid small{display:block;color:var(--muted);font:9px DM Mono,monospace;letter-spacing:.08em;text-transform:uppercase}
.job-detail-grid strong{display:block;margin-top:2px;font-size:13px;font-weight:600}
.job-detail-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
.job-detail-actions .btn{width:auto;margin:0}
.brief-steps{list-style:none;margin:16px 0;padding:0;display:grid;gap:12px}
.brief-steps label{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-weight:600;font-size:13px}
.brief-steps label span{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--surface-2);font:10px DM Mono,monospace}
.brief-steps em{font-style:normal;color:var(--muted);font:9px DM Mono,monospace;letter-spacing:.06em;text-transform:uppercase}
@media (max-width:900px){.job-detail-grid{grid-template-columns:1fr 1fr}}
.held-note{color:var(--amber);font-size:11px}
tr.subtask-row>td{background:var(--surface-2);padding:0 14px 14px!important}
.subtask-panel{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.subtask-panel-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:10px 14px;border-bottom:1px solid var(--line)}
.subtask-panel-head small{color:var(--muted)}
.subtask{display:grid;grid-template-columns:10px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line)}

.subtask strong{display:block;font-size:13px}
.subtask small{color:var(--muted);font-size:12px}
.subtask .pill{margin:0}
.subtask .btn{width:auto;margin:0;min-height:32px}
.subtask .btn .icon{width:13px;height:13px}
.subtask.held{background:color-mix(in srgb,var(--amber) 7%,transparent)}
.subtask-done{color:var(--muted);font-size:12px;padding:0 10px}
.subtask-empty{padding:12px 0;margin:0}
.stage-track{display:flex;gap:4px;list-style:none;margin:0 0 18px;padding:0;overflow-x:auto}
.stage-track li{display:flex;align-items:center;gap:6px;flex:1 0 auto;padding:7px 10px;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:11px;white-space:nowrap}
.stage-track li span{display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--surface-2);font:10px DM Mono,monospace}
.stage-track li.done{color:var(--ink)}
.stage-track li.done span{background:var(--moss);color:#fff}
.stage-track li.current{border-color:var(--accent);color:var(--ink);font-weight:700}
.stage-track li.current span{background:var(--accent);color:#fff}

/* Brief Capture list */
.flow-alert{display:flex;gap:14px;align-items:center;margin-bottom:14px;padding:14px 16px;border:1px solid;border-radius:var(--r)}

.flow-alert>div{flex:1;display:grid;gap:3px;min-width:0}
.flow-alert span{color:var(--ink-2);font-size:13px}
.flow-alert .btn{width:auto;margin:0;flex:0 0 auto}
.flow-alert.warn{background:color-mix(in srgb,var(--amber) 11%,var(--surface));border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
.flow-alert.warn>.icon{color:var(--amber)}
.flow-alert.info{background:color-mix(in srgb,var(--blue) 9%,var(--surface));border-color:color-mix(in srgb,var(--blue) 35%,transparent)}
.flow-alert.info>.icon{color:var(--blue)}
.request-ops-bar article.alert{border-color:var(--amber);background:color-mix(in srgb,var(--amber) 10%,var(--surface))}
.request-ops-bar article.alert strong{color:var(--amber)}
.client-request-group{margin-bottom:18px}
.client-request-group>header{display:flex;align-items:center;gap:12px;margin:0 0 10px}
.client-request-group>header h3{margin:0;font-size:17px}
.client-request-group>header small{color:var(--muted)}

  App.syncAMField = function (client, id) {

  App.saveRequest = function (e, id) {
    e.preventDefault();

      writtenBrief = String(f.get("writtenBrief") || "").trim();

      const r = findReq(id);
      Object.assign(r, { client: f.get("client"), campaign: f.get("campaign"), source: f.get("source"), priority: f.get("priority") });

      am = String(f.get("am") || "—"),
      files = f.getAll("files").map(String);

  App.createRequest = function ({ source, client, campaign, priority, am, files = [], writtenBrief = "", deliverables = [], deadline = "", description = "", note = "" }) {
    const id = nextRequestId(),
      r = { id, source, client, campaign, stage: "Incoming", am: am || "—", priority, date: TODAY_ISO, deadline, description, files, isNew: true };

    const w = this.ensureWorkflow(r);
    Object.assign(w, { am: am === "—" ? "" : am, writtenBrief, deliverables, departments: [] });
    w.attachments.push(...files.map((name) => ({ name, by: `${source} capture` })));
    w.audit.push(`Request ${id} created from ${source} by ${this.role().name}${note ? " · " + note : ""}`);
    if (w.am) w.audit.push(`Auto-assigned to ${w.am} from the ${client} client mapping · awaiting acceptance`);
    const sent = w.am && w.am !== this.role().name ? this.notify([w.am], `New request ${id} assigned to you`, `${client} · ${campaign} — accept it or decline with a reason.`, { type: "workflow", id }, "info") : "";
    if (this.state.role !== "servicing") this.notify(["servicing"], `New request ${id}`, `${client} · ${campaign} · logged by ${this.role().name}`, { type: "workflow", id }, "info");

  /* ---------- Manual log with parse simulation ---------- */
  const SAMPLE_NOTES = [
    {
      client: "Nexa Motors",

  ];
  const PARSE_STEPS = ["Reading the message", "Identifying the client", "Extracting the matter and deliverables", "Detecting urgency and deadline", "Matching the account manager and files"];
  const CLIENT_HINTS = {
    "Nexa Motors": /nexa|electric horizon|\bev\b|dealer/i,
    "Aster Foods": /aster|recipe|shelf talker/i,
    "Brio Finance": /brio|investor|sebi/i,
    "Zuri Living": /zuri|store banner|home/i,
    "Northstar Health": /northstar|health/i,
  };
  const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  App.parseRequestText = function (text) {
    const clients = this.getAccessibleClients(),
      lower = text.toLowerCase();
    const client = clients.find((c) => lower.includes(c.name.toLowerCase())) || clients.find((c) => CLIENT_HINTS[c.name]?.test(text));
    const outOfScope = !client ? Object.keys(CLIENT_HINTS).find((n) => lower.includes(n.toLowerCase()) || CLIENT_HINTS[n].test(text)) : null;
    const source = /whatsapp/i.test(text) ? "WhatsApp" : /\bcall(ed)?\b|phone/i.test(text) ? "Phone Call" : /meeting|met with/i.test(text) ? "Client Meeting" : "Offline / Verbal";
    const priority = /urgent|asap|critical|immediately/i.test(text) ? "Critical" : /friday|this week|tomorrow/i.test(text) ? "High" : "Normal";
    let deadline = new Date(TODAY);
    deadline.setDate(deadline.getDate() + 10);
    const day = text.match(/\bby (monday|tuesday|wednesday|thursday|friday|saturday|sunday)\b/i),
      date = text.match(/\b(?:by|on)\s+(\d{1,2})\s*(jan|feb|mar|apr|may|jun|jul|aug|sep|oct|nov|dec)[a-z]*/i);
    if (day) {
      const target = ["sunday", "monday", "tuesday", "wednesday", "thursday", "friday", "saturday"].indexOf(day[1].toLowerCase());
      deadline = new Date(TODAY);
      deadline.setDate(deadline.getDate() + (((target - deadline.getDay() + 7) % 7) || 7));
    } else if (date) deadline = new Date(2026, MONTHS.indexOf(date[2].toLowerCase()), Number(date[1]));
    const deliverables = [...text.matchAll(/\b(\d+)\s+([a-z][a-z -]{2,40}?)(?=\s*(?:,|\band\b|\.|;|\bby\b|\bfor\b|\bon\b|$))/gi)]
      .filter((m) => !MONTHS.some((mo) => m[2].toLowerCase().startsWith(mo)))
      .map((m) => `${m[1]} × ${m[2].trim()}`);
    const files = [...new Set(text.match(/[\w-]+\.(?:pdf|pptx?|xlsx?|docx?|png|jpe?g|zip|mp4)/gi) || [])];
    const titleMatch = text.match(/[Ff]or the ([A-Z][^,.:;]*?(?:launch|campaign|push|window|day))/) || text.match(/\b([A-Z][a-z]+(?: [a-z]+){0,2} (?:push|launch|campaign))\b/) || text.match(/\b(investor day|dealer launch|festive campaign)\b/i);
    let title = titleMatch ? titleMatch[1] : deliverables[0] ? deliverables[0].replace(/^\d+ × /, "") : "Client request";
    title = title.charAt(0).toUpperCase() + title.slice(1);
    const contact = (text.match(/(?:from|with)\s+([A-Z][a-z]+(?: [A-Z][a-z]+)?)/) || [])[1] || "";
    const description = text.replace(/\s+/g, " ").trim();
    const filled = ["source", "client", "am", "title", "description", "deliverables", "priority", "deadline", ...(files.length ? ["files"] : [])].filter((k) => k !== "client" || client);
    return {
      source,
      client: client?.name || "",
      am: client?.am || "",
      outOfScope,
      title,
      contact,
      description,
      deliverables,
      priority,
      deadline: iso(deadline),
      files,
      filled,
      confidence: client ? (deliverables.length ? 94 : 82) : 61,
    };
  };

id="manual-priority" name="priority" class="input">${["Normal", "High", "Critical"].map((x) => `<option ${p.priority === x ? "selected" : ""}>${x}</option>`).join("")}</select></div><div class="field span-2"><label for="manual-desc">What the client asked for ${tag("description")}</label><textarea id="manual-desc" name="desc" class="input" rows="3" required>${esc(p.description || "")}</textarea></div><div class="field"><label for="manual-deadline">Deadline ${tag("deadline")}</label><input id="manual-deadline" type="date" name="deadline" class="input" required value="${esc(p.deadline || "2026-09-25")}"></div><div class="field span-2"><label for="manual-deliverables">Deliverables <span class="optional">one per line</span> ${tag("deliverables")}</label><textarea id="manual-deliverables" name="deliverables" class="input" rows="3">${esc((p.deliverables || []).join("\n"))}</textarea></div><div class="field"><label>Files ${tag("files")}</label>${p.files?.length ? `<div class="file-check-list">${p.files.map((f) => `<label><input type="checkbox" name="files" value="${esc(f)}" checked>${icon("clip")}${esc(f)}</label>`).join("")}</div>` : `<p class="field-help">No files mentioned.</p>`}</div></div><div class="modal-foot manual-foot"><span class="save-state">The AM is notified and asked to accept.</span><button type="button" class="btn" onclick="App.closeModal()">Cancel</button><button class="btn primary">${icon("plus")} Create request</button></div></form>`;

        this.state.chatMessages.push({ role: "user", text: q });

        routedChatSend.call(this, q);

  App.toggleVoiceInput = function () {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (this.state.voiceRecognition) {
      this.state.voiceRecognition.stop();
      return;
    }
    if (!SpeechRecognition) {
      this.toast("Voice to text is not supported in this browser");
      return;
    }
    const rec = new SpeechRecognition();
    rec.lang = "en-IN";
    rec.interimResults = true;
    rec.onstart = () => {
      this.state.voiceActive = true;
      this.render();
    };
    rec.onresult = (event) => {
      this.state.voiceDraft = Array.from(event.results)
        .map((r) => r[0].transcript)
        .join("");
      const input = document.getElementById("chat-input");
      if (input) input.value = this.state.voiceDraft;
    };
    rec.onerror = () => this.toast("Voice input could not be started");
    rec.onend = () => {
      this.state.voiceActive = false;
      this.state.voiceRecognition = null;
      this.render();
    };
    this.state.voiceRecognition = rec;
    rec.start();

      w = this.ensureWorkflow(r);
    if (!this.canEditWorkflow(r) || !w.assignmentAccepted) {
      this.toast("Only the account manager can generate the brief");
      return;
    }
    this.captureWorkflowDraft();
    this.state.aiGenerating = id;
    this.renderModal();
    setTimeout(() => {
      this.state.aiGenerating = null;
      const ai = this.aiBriefFor(r, w);
      w.draft = { writtenBrief: ai.brief, deliverables: ai.deliverables.join("\n") };
      w.aiPending = true;
      w.audit.push(`AI drafted the written brief for ${w.am} · not saved yet`);
      if (this.state.modal?.type === "briefWorkflow" && this.state.modal.id === id) this.renderModal();
      this.toast("AI brief ready · review it, then Save brief");
    }, 1400);
  };
  const baseSaveWorkflowBrief = App.saveWorkflowBrief;
  App.saveWorkflowBrief = function (e, id) {
    const r = findReq(id);
    if (r) this.ensureWorkflow(r).aiPending = false;
    return baseSaveWorkflowBrief.call(this, e, id);
  };

  /* ---------- Client Servicing Head reviews work; account managers create it ---------- */
  const isCSH = () => App.state.role === "servicing";
  const reviewOnly = (what) => App.toast(`${what} is done by account managers. The Client Servicing Head reviews and assigns.`);
  ["openManualRequestModal", "openNewRequestFromMail", "openRequest", "createRequest", "chatCaptureBrief", "chatCreateTask", "publishTaskList"].forEach((name) => {
    const base = App[name];
    App[name] = function () {
      if (isCSH() && !this.state.handoff) return reviewOnly("Creating requests and tasks");
      return base.apply(this, arguments);
    };
  });
  App.pageHead = function () {
    if (this.state.view === "chatops") return "";
    const [k, t, d] = this.pageMeta(),
      log = isCSH() ? "" : `<button class="btn primary" onclick="App.openManualRequestModal()">${icon("plus")} Log Manual Request</button>`,
      actions = {
        dashboard: `<button class="btn" onclick="App.nav('mailbox')">${icon("mail")} Email Monitoring</button>${log}`,
        requests: `<button class="btn" onclick="App.nav('mailbox')">${icon("mail")} Email Monitoring</button>${log}`,
        jobs: `<button class="btn" onclick="App.nav('board')">${icon("columns")} Task Management</button>${log}`,
      };
    return `<div class="page-head"><div><div class="kicker">${k}</div><h1>${t}</h1><p>${d}</p></div><div class="page-head-actions">${actions[this.state.view] || ""}</div></div>`;
  };
  const baseDashboard = App.view_dashboard;
  App.view_dashboard = function () {
    const html = baseDashboard.call(this);
    if (!isCSH()) return html;
    return html.replace(
      /<button class="quick-action" onclick="App\.openManualRequestModal\(\)">.*?<\/button>/,
      `<button class="quick-action" onclick="App.nav('requests')"><span class="insight-icon">${icon("inbox")}</span><span><strong>Review briefs</strong><small>Re-delegations and requests to assign</small></span></button>`,
    );
  };
  const reviewChatSend = App.chatSend;
  App.chatSend = function (raw) {
    const q = String(raw || "").trim();
    if (isCSH() && /capture|new brief|create brief|brief intake|create task|add task|new task|task for/i.test(q) && !this.state.chatTyping) {
      this.chatInit();
      this.state.chatMessages.push({ role: "user", text: q });
      this.state.chatMessages.push({
        role: "assistant",
        kicker: "REVIEW ROLE",
        text: "Briefs and tasks are created by the account managers. I can show you what needs your review: re-delegation requests, unassigned requests and briefs awaiting approval.",
        actions: ["Show the brief awaiting approval", "Show blocked work"],
      });
      this.state.chatWorkspace = { type: "briefing", title: "Today · 25 September" };
      this.render();
      this.scrollChat();
      return;
    }
    if (/need an (account manager|am)|re-?delegat|waiting for my acceptance|awaiting (my )?acceptance/i.test(q) && !this.state.chatTyping) {
      this.chatInit();
      const me = this.role().name,
        rows = this.getAccessibleRequests().filter((r) => {
          const w = this.ensureWorkflow(r);
          return isCSH() ? w.redelegationRequested || !w.am : w.am === me && !w.assignmentAccepted && !w.redelegationRequested;
        });
      this.state.chatMessages.push({ role: "user", text: q });
      this.state.chatMessages.push({
        role: "assistant",
        kicker: isCSH() ? "REQUESTS TO ASSIGN" : "WAITING FOR YOU",
        text: rows.length
          ? isCSH()
            ? `${rows.length} request${rows.length === 1 ? " needs" : "s need"} an account manager. Re-delegations are listed with the AM’s reason.`
            : `${rows.length} request${rows.length === 1 ? " is" : "s are"} waiting for you. Accept to start the brief, or decline with a reason.`
          : isCSH()
            ? "Every request has an account manager. Nothing is waiting for re-delegation."
            : "Nothing is waiting for your acceptance.",
        html: rows.length
          ? `<div class="chat-mini-list">${rows
              .map((r) => {
                const w = r.workflow,
                  [cls, label] = this.requestOwnerStatus(r);
                return `<div class="chat-mini"><span class="mono">${esc(r.id)}</span><div><strong>${esc(r.client)} · ${esc(r.campaign)}</strong><small>${w.redelegationRequested ? "Declined by " + esc(w.redelegatedBy) + ": “" + esc(w.redelegationReason) + "”" : esc(r.source) + " · " + esc(r.priority) + " priority"}</small></div><span class="owner-status ${cls}">${label}</span><button class="btn small" onclick="App.openBriefWorkflow('${r.id}')">Open</button></div>`;
              })
              .join("")}</div>`
          : "",
        actions: [],
      });
      this.render();
      this.scrollChat();
      return;
    }
    return reviewChatSend.call(this, raw);
  };
  const baseRenderModalForReview = App.renderModal;
  App.renderModal = function () {
    const result = baseRenderModalForReview.call(this);
    if (isCSH() && this.state.modal?.type === "requestChoice") {
      const paths = document.querySelectorAll("#modal-root .request-path");
      const m = this.data.mailbox.find((x) => x.id === this.state.modal.mailId) || {},
        am = this.data.clients.find((c) => c.name === m.client)?.am || "the account manager";
      if (paths[1])
        paths[1].outerHTML = `<div class="request-path"><span class="request-path-icon new">${icon("plus")}</span><div><h3>Send as a new request</h3><p>Creates a new request for ${esc(am)}, who owns ${esc(m.client)}. They accept it and write the brief.</p></div><div class="request-preview"><small>Client</small><strong>${esc(m.client)}</strong><small>Request title</small><strong>${esc(m.subject)}</strong><small>Account manager</small><strong>${esc(am)}</strong></div><button class="btn primary" onclick="App.handoffMailToAM(${m.id})">Send to ${esc(am)} ${icon("arrow")}</button></div>`;
    }
    return result;
  };

  App.handoffMailToAM = function (mailId) {
    const m = this.data.mailbox.find((x) => x.id === mailId);
    if (!m) return;
    const am = this.data.clients.find((c) => c.name === m.client)?.am || "—";
    this.state.handoff = true;
    try {
      const r = this.createRequest({ source: "Email", client: m.client, campaign: m.subject, priority: m.priority, am, files: mailFiles(m), writtenBrief: "", note: `sent to ${am} from Email Monitoring` });
      Object.assign(m, { kind: "Request", unread: false, mappedTo: r?.id });
    } finally {
      this.state.handoff = false;
    }
  };

  /* ---------- Manual brief capture (structured form, from the dashboard) ---------- */
  const BRIEF_SECTIONS = [
    ["clientWords", "Client request", "What did the client ask for, in their own words?"],
    ["audience", "Audience", "Who are we trying to reach?"],
    ["competition", "Competition", "Who or what are we competing against?"],
    ["objective", "Communication objective", "What must the work achieve?"],
    ["mandatories", "Mandatories", "What must be included? Brand, legal, format…"],
  ];
  App.openManualBrief = function () {
    if (isCSH()) return reviewOnly("Capturing briefs");
    this.state.modal = { type: "manualBrief" };
    this.renderModal();
    requestAnimationFrame(() => document.getElementById("mb-title")?.focus());
  };
  App.manualBriefModal = function () {
    const clients = this.getAccessibleClients(),
      am = clients[0]?.am || "—";
    return `<div class="modal-layer" onclick="if(event.target===this)App.closeModal()"><form class="modal manual-modal" onsubmit="App.saveManualBrief(event)" role="dialog" aria-modal="true" aria-labelledby="manual-brief-title"><div class="modal-head"><div><div class="kicker">OFFLINE & MANUAL CAPTURE</div><h2 id="manual-brief-title">Log manual request</h2><p class="muted">Write the brief yourself, section by section. It is saved under the client and goes straight to approval.</p></div><button type="button" class="icon-btn" aria-label="Close" onclick="App.closeModal()">${icon("x")}</button></div><div class="modal-body">${this.captureModeSwitch("write")}<div class="manual-grid"><div class="field"><label for="mb-client">Client</label><select id="mb-client" name="client" class="input" required onchange="App.syncAMField(this.value,'mb-am')">${clients.map((c) => `<option>${esc(c.name)}</option>`).join("")}</select></div><div class="field"><label>Account manager</label><div class="input readonly-am" id="mb-am-label">${esc(am)}</div><input type="hidden" id="mb-am" name="am" value="${esc(am)}"></div><div class="field"><label for="mb-source">How it arrived</label><select id="mb-source" name="source" class="input">${["Client Meeting", "Phone Call", "WhatsApp", "Offline / Verbal"].map((x) => `<option>${x}</option>`).join("")}</select></div><div class="field span-2"><label for="mb-title">Matter / campaign</label><input id="mb-title" name="title" class="input" required placeholder="e.g. Festive packaging sleeves"></div><div class="field"><label for="mb-priority">Priority</label><select id="mb-priority" name="priority" class="input"><option>Normal</option><option>High</option><option>Critical</option></select></div></div><ol class="brief-steps">${BRIEF_SECTIONS.map(([k, label, hint], i) => `<li><label for="mb-${k}"><span>${i + 1}</span>${label} <em>Required</em></label><textarea id="mb-${k}" name="${k}" class="input" rows="2" required placeholder="${hint}"></textarea></li>`).join("")}</ol><div class="manual-grid"><div class="field span-2"><label for="mb-deliverables">Deliverables <span class="optional">one per line</span></label><textarea id="mb-deliverables" name="deliverables" class="input" rows="3" placeholder="e.g. 4 shelf talkers&#10;1 recipe film"></textarea></div><div class="field"><label for="mb-deadline">Deadline</label><input id="mb-deadline" type="date" name="deadline" class="input" required value="2026-09-30"></div></div></div><div class="modal-foot"><span class="save-state">${icon("shield")} No job is created until the client approves in writing.</span><button type="button" class="btn" onclick="App.closeModal()">Cancel</button><button class="btn primary">Save brief ${icon("arrow")}</button></div></form></div>`;
  };
  App.saveManualBrief = function (e) {
    e.preventDefault();
    const f = new FormData(e.target),
      v = (k) => String(f.get(k) || "").trim(),
      deadline = v("deadline"),
      due = new Date(deadline).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }),
      deliverables = v("deliverables").split(/\r?\n/).map((x) => x.trim()).filter(Boolean),
      writtenBrief = `CLIENT REQUEST\n${v("clientWords")}\n\nAUDIENCE\n${v("audience")}\n\nCOMPETITION\n${v("competition")}\n\nCOMMUNICATION OBJECTIVE\n${v("objective")}\n\nMANDATORIES & DEADLINE\n${v("mandatories")} Deliver by ${due}.`;
    const r = this.createRequest({ source: v("source"), client: v("client"), campaign: v("title"), priority: v("priority"), am: v("am"), deadline, deliverables, writtenBrief, note: "brief captured manually" });
    if (!r) return;
    const w = this.ensureWorkflow(r),
      mine = w.am === this.role().name;
    Object.assign(w, { clientWords: v("clientWords"), audience: v("audience"), competition: v("competition"), objective: v("objective"), mandatories: v("mandatories") });
    if (mine) {
      w.assignmentAccepted = true;
      r.stage = "Brief in progress";
      this.prepareDepartmentHandoff(r, w);
      w.audit.push(`Brief written and owned by ${w.am} · ready for approval`);
    }
    this.render();
    this.openBriefWorkflow(r.id);
    if (mine) this.setWorkflowTab("approvals");
  };
  const baseRenderModalForBrief = App.renderModal;
  App.renderModal = function () {
    if (this.state.modal?.type === "manualBrief") {
      document.getElementById("modal-root").innerHTML = this.manualBriefModal();
      return;
    }
    return baseRenderModalForBrief.call(this);
  };

  /* Re-rendering an open popup must not replay its entrance animation or lose its scroll position. */
  const baseRenderModalStable = App.renderModal;
  App.renderModal = function () {
    const root = document.getElementById("modal-root"),
      type = (this.state.modal?.type || "").replace("manualBrief", "manualRequest"),
      same = !!type && root.dataset.type === type && !!root.firstElementChild,
      scrolls = same ? [...root.querySelectorAll(".modal-body,.workflow-body")].map((el) => el.scrollTop) : [];
    root.classList.toggle("modal-stable", same);
    const result = baseRenderModalStable.call(this);
    root.dataset.type = this.state.modal ? type : "";
    if (same) root.querySelectorAll(".modal-body,.workflow-body").forEach((el, i) => scrolls[i] != null && (el.scrollTop = scrolls[i]));
    return result;
  };

  /* Keep the existing backend sync behaviour for the new state-changing actions. */
  ["toggleTaskHold", "submitDecline", "addWorkflowNote", "toggleWorkflowDept", "mapMailToExisting"].forEach((name) => {
    const fn = App[name];
    App[name] = function () {
      const result = fn.apply(this, arguments);
      this.syncBackendState();
      return result;
    };
  });

  if (new URLSearchParams(location.search).get("redelegate") === "1") App.state.declineOpen = new URLSearchParams(location.search).get("workflow");
  App.render();
  if (App.state.modal) App.renderModal();
})();
</script>
<style id="ccl-login-style">
.login-screen{position:fixed;inset:0;z-index:2000;display:grid;place-items:center;padding:16px;background:var(--paper);background-image:radial-gradient(circle at 80% 0,color-mix(in srgb,var(--accent) 12%,transparent),transparent 40%)}
.login-card{width:min(400px,100%);display:grid;gap:16px;padding:28px;border:1px solid var(--line);border-radius:14px;background:var(--surface);box-shadow:0 24px 60px rgba(0,0,0,.14)}
.login-brand{display:flex;align-items:center;gap:10px}
.login-brand .brand-mark{width:38px;height:34px;display:grid;place-items:center;border-radius:9px;background:linear-gradient(120deg,#ff5f6d,#ffc371);color:#fff;font-size:19px}
.login-brand strong{display:block;font-size:15px}
.login-brand small{display:block;color:var(--muted);font-size:12px}
.login-card h1{margin:4px 0 0;font-size:24px;letter-spacing:-.02em;color:var(--ink)}
.login-card p{margin:0;color:var(--muted);font-size:13px}
.login-card label{display:grid;gap:6px;font-weight:600;font-size:13px;color:var(--ink)}
.login-card .btn{width:100%;margin:0}
.login-error{min-height:18px;color:var(--red);font-size:12px}
.login-link{justify-self:center;border:0;background:none;color:var(--muted);font-size:12px;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
.login-link:hover{color:var(--ink)}
.login-note{margin:-8px 0 0!important;font-size:11px!important}
.login-success{padding:9px 12px;border-radius:8px;background:color-mix(in srgb,var(--moss) 12%,transparent);color:var(--moss);font-size:12px}
.login-hint{padding:10px 12px;border-radius:8px;background:var(--surface-2);color:var(--muted);font-size:12px;line-height:1.5}
.login-hint code{font:600 12px DM Mono,monospace;color:var(--ink)}
.login-card.shake{animation:loginShake .3s}
@keyframes loginShake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
<script>
/* LOGIN GATE — one admin account in front of the demo. The credentials live in this file and in the
   browser, so this keeps casual visitors out but is not real security.
   A password reset or change is saved (as a SHA-256 hash) in this browser only. */
(function () {
  const EMAIL = "admin@conceptindia.com";
  const DEFAULT_PASSWORD = "Admin@1234";
  const SESSION_KEY = "ccl-demo-session";
  const PASSWORD_KEY = "ccl-demo-password-hash";
  const store = {
    get: (area, k) => { try { return window[area].getItem(k); } catch (e) { return null; } },
    set: (area, k, v) => { try { v === null ? window[area].removeItem(k) : window[area].setItem(k, v); } catch (e) {} },
  };
  const sha256 = async (text) => {
    if (!window.crypto?.subtle) {
      // Plain-http pages have no Web Crypto; fall back to a simple FNV-1a hash.
      let h = 0x811c9dc5;
      for (const c of text) h = Math.imul(h ^ c.codePointAt(0), 0x01000193) >>> 0;
      return "fnv-" + h.toString(16);
    }
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
    return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
  };
  const checkPassword = async (pw) => {
    const saved = store.get("localStorage", PASSWORD_KEY);
    return saved ? (await sha256(pw)) === saved : pw === DEFAULT_PASSWORD;
  };
  const strongEnough = (pw) => pw.length >= 8 && /[A-Za-z]/.test(pw) && /\d/.test(pw);
  const brand = `<div class="login-brand"><span class="brand-mark">C</span><div><strong>CCL AI</strong><small>Agency Operations</small></div></div>`;
  const newPasswordFields = `<label>New password<input class="input" name="pw1" type="password" autocomplete="new-password" required minlength="8"></label><label>Confirm new password<input class="input" name="pw2" type="password" autocomplete="new-password" required minlength="8"></label><p class="login-note">At least 8 characters, with a letter and a number.</p>`;

  const views = {
    signin: (msg = "") =>
      `<form class="login-card" onsubmit="event.preventDefault();CCLLogin.signIn(this)" aria-labelledby="login-title">${brand}<div><h1 id="login-title">Sign in</h1><p>Use your admin account to open the workspace.</p></div>${msg ? `<div class="login-success" role="status">${msg}</div>` : ""}<label>Email<input class="input" name="email" type="email" autocomplete="username" required></label><label>Password<input class="input" name="pass" type="password" autocomplete="current-password" required></label><div class="login-error" role="alert"></div><button class="btn primary">Sign in</button><button type="button" class="login-link" onclick="CCLLogin.show('reset')">Forgot password?</button></form>`,
    reset: () =>
      `<form class="login-card" onsubmit="event.preventDefault();CCLLogin.reset(this)" aria-labelledby="login-title">${brand}<div><h1 id="login-title">Reset password</h1><p>Enter the admin email and choose a new password.</p></div><label>Email<input class="input" name="email" type="email" autocomplete="username" required></label>${newPasswordFields}<div class="login-error" role="alert"></div><button class="btn primary">Reset password</button><button type="button" class="login-link" onclick="CCLLogin.show('signin')">Back to sign in</button></form>`,
    change: () =>
      `<form class="login-card" onsubmit="event.preventDefault();CCLLogin.change(this)" aria-labelledby="login-title">${brand}<div><h1 id="login-title">Change password</h1><p>Signed in as ${EMAIL}.</p></div><label>Current password<input class="input" name="current" type="password" autocomplete="current-password" required></label>${newPasswordFields}<div class="login-error" role="alert"></div><button class="btn primary">Update password</button><button type="button" class="login-link" onclick="CCLLogin.close()">Cancel</button></form>`,
  };

  function show(view, msg) {
    let el = document.getElementById("login-screen");
    if (!el) {
      el = document.createElement("div");
      el.id = "login-screen";
      el.className = "login-screen";
      document.body.appendChild(el);
    }
    el.classList.toggle("dismissable", view === "change");
    el.innerHTML = views[view](msg);
    requestAnimationFrame(() => el.querySelector("input")?.focus());
  }
  function fail(form, text, field) {
    form.querySelector(".login-error").textContent = text;
    form.classList.remove("shake");
    void form.offsetWidth;
    form.classList.add("shake");
    if (field) {
      form[field].value = "";
      form[field].focus();
    }
  }
  function newPasswordError(form) {
    const a = form.pw1.value,
      b = form.pw2.value;
    if (!strongEnough(a)) return "Use at least 8 characters, with a letter and a number.";
    if (a !== b) return "The two new passwords do not match.";
    return "";
  }

  window.CCLLogin = {
    show,
    async signIn(form) {
      const email = form.email.value.trim().toLowerCase();
      if (email !== EMAIL || !(await checkPassword(form.pass.value))) return fail(form, "That email or password is not right.", "pass");
      store.set("sessionStorage", SESSION_KEY, EMAIL);
      document.getElementById("login-screen")?.remove();
      App.render();
    },
    async reset(form) {
      if (form.email.value.trim().toLowerCase() !== EMAIL) return fail(form, "That email does not match the admin account.", "email");
      const err = newPasswordError(form);
      if (err) return fail(form, err, "pw2");
      store.set("localStorage", PASSWORD_KEY, await sha256(form.pw1.value));
      show("signin", "Password reset. Sign in with your new password.");
    },
    async change(form) {
      if (!(await checkPassword(form.current.value))) return fail(form, "Your current password is not right.", "current");
      const err = newPasswordError(form);
      if (err) return fail(form, err, "pw2");
      store.set("localStorage", PASSWORD_KEY, await sha256(form.pw1.value));
      this.close();
      App.toast("Password updated");
    },
    close() {
      document.getElementById("login-screen")?.remove();
    },
    signOut() {
      store.set("sessionStorage", SESSION_KEY, null);
      App.closeModal();
      App.closePalette();
      show("signin");
    },
  };

  const icon = (d) => `<svg class="icon" aria-hidden="true" viewBox="0 0 24 24">${d}</svg>`;
  const baseTopbar = App.topbar;
  App.topbar = function () {
    return baseTopbar
      .call(this)
      .replace(
        '<span class="notif-wrap">',
        `<button class="icon-btn" aria-label="Change password" title="Change password" onclick="CCLLogin.show('change')">${icon('<circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M15 8l2 2"/>')}</button><button class="icon-btn" aria-label="Sign out" title="Sign out" onclick="CCLLogin.signOut()">${icon('<path d="M15 4h4v16h-4M10 17l5-5-5-5M15 12H4"/>')}</button><span class="notif-wrap">`,
      );
  };
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && document.querySelector(".login-screen.dismissable")) CCLLogin.close();
  });

  if (store.get("sessionStorage", SESSION_KEY) !== EMAIL) show("signin");
  App.render();
})();
</script>
